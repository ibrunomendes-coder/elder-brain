services:
  elder-brain:
    image: ${AI_MEMORY_IMAGE:-akitaonrails/ai-memory:latest}
    container_name: elder-brain
    user: "1000:1000"
    command: ["serve", "--transport", "http", "--bind", "0.0.0.0:49374", "--enable-web"]
    environment:
      AI_MEMORY_DATA_DIR: /data
      # Required: ai-memory refuses a non-loopback bind without authentication.
      AI_MEMORY_AUTH_TOKEN: ${AI_MEMORY_AUTH_TOKEN}
      # Accepted Host headers. Include the private IP/DNS names clients use.
      AI_MEMORY_ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      # Optional but recommended: LLM consolidation and embeddings.
      AI_MEMORY_LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      AI_MEMORY_EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      AI_MEMORY_LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      # Publish only on a private interface (tailnet/VPN/LAN). Never expose
      # plain HTTP to the public internet without TLS and a reverse proxy.
      - "${BIND_IP:-127.0.0.1}:49374:49374"
    volumes:
      - ./data:/data
    restart: unless-stopped
